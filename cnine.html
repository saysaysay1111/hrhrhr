<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="씨나인 시그 목록 검색 페이지" />
  <title>씨나인 시그 검색</title>
  <style>
    :root {
      --bg: #090d18;
      --panel: rgba(18, 24, 42, 0.86);
      --panel-2: rgba(28, 35, 58, 0.82);
      --line: rgba(255, 255, 255, 0.09);
      --text: #f5f7ff;
      --muted: #aab2ca;
      --gold: #f5c66b;
      --gold-2: #ffe6aa;
      --accent: #7c8cff;
      --danger: #ff7c98;
      --shadow: 0 18px 45px rgba(0, 0, 0, 0.36);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(124, 140, 255, 0.18), transparent 34%),
        radial-gradient(circle at top right, rgba(245, 198, 107, 0.13), transparent 28%),
        linear-gradient(180deg, #080b14 0%, #0d1220 52%, #090d18 100%);
    }

    button, input, select { font: inherit; }

    .wrap {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 54px 0 80px;
    }

    .hero {
      text-align: center;
      margin-bottom: 28px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 13px;
      border: 1px solid rgba(245, 198, 107, 0.35);
      border-radius: 999px;
      color: var(--gold-2);
      background: rgba(245, 198, 107, 0.08);
      font-size: 13px;
      letter-spacing: 0.08em;
      font-weight: 800;
    }

    h1 {
      margin: 18px 0 10px;
      font-size: clamp(34px, 5vw, 58px);
      line-height: 1.05;
      letter-spacing: -0.045em;
    }

    h1 span {
      background: linear-gradient(135deg, #ffffff 18%, var(--gold-2) 58%, var(--gold) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .control-panel {
      position: sticky;
      top: 12px;
      z-index: 10;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(10, 14, 25, 0.84);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
      margin-bottom: 22px;
    }

    .search-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 180px 150px;
      gap: 12px;
    }

    .search-box {
      position: relative;
    }

    .search-box svg {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      opacity: 0.72;
      pointer-events: none;
    }

    input[type="search"], select, .clear-btn {
      width: 100%;
      min-height: 52px;
      border: 1px solid var(--line);
      border-radius: 15px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.055);
      outline: none;
      transition: 0.2s ease;
    }

    input[type="search"] {
      padding: 0 48px 0 48px;
    }

    input[type="search"]::placeholder { color: #7f89a5; }

    input[type="search"]:focus, select:focus {
      border-color: rgba(245, 198, 107, 0.75);
      box-shadow: 0 0 0 4px rgba(245, 198, 107, 0.09);
    }

    select {
      padding: 0 14px;
      cursor: pointer;
    }

    option { background: #151b2d; }

    .clear-btn {
      cursor: pointer;
      font-weight: 800;
      color: #dfe4f7;
    }

    .clear-btn:hover {
      border-color: rgba(124, 140, 255, 0.7);
      background: rgba(124, 140, 255, 0.12);
    }

    .meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 14px;
    }

    .count strong { color: var(--gold-2); }

    .hint {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      min-height: 82px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 18px;
      color: inherit;
      background: linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0.025));
      cursor: pointer;
      text-align: left;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }

    .item:hover {
      transform: translateY(-2px);
      border-color: rgba(245, 198, 107, 0.35);
      background: linear-gradient(160deg, rgba(245,198,107,0.10), rgba(255,255,255,0.035));
    }

    .number {
      flex: 0 0 auto;
      min-width: 74px;
      padding: 10px 11px;
      border-radius: 13px;
      color: #15110a;
      background: linear-gradient(135deg, var(--gold-2), var(--gold));
      text-align: center;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: -0.02em;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.5);
    }

    .name {
      min-width: 0;
      flex: 1;
      font-size: 16px;
      font-weight: 780;
      line-height: 1.35;
      word-break: keep-all;
    }

    .copy-mark {
      flex: 0 0 auto;
      color: #828da9;
      font-size: 12px;
      opacity: 0;
      transition: opacity .18s ease;
    }

    .item:hover .copy-mark { opacity: 1; }

    .empty {
      grid-column: 1 / -1;
      padding: 72px 24px;
      border: 1px dashed rgba(255,255,255,0.16);
      border-radius: 22px;
      color: var(--muted);
      text-align: center;
      background: rgba(255,255,255,0.025);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 30px;
      transform: translate(-50%, 30px);
      padding: 12px 18px;
      border: 1px solid rgba(245, 198, 107, 0.35);
      border-radius: 999px;
      color: #fff7df;
      background: rgba(15, 18, 29, 0.95);
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: .22s ease;
      z-index: 20;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    footer {
      margin-top: 30px;
      color: #77819a;
      font-size: 12px;
      text-align: center;
    }

    .creator {
      position: fixed;
      right: 16px;
      bottom: 12px;
      z-index: 30;
      padding: 7px 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      color: rgba(220, 226, 244, 0.72);
      background: rgba(9, 13, 24, 0.7);
      backdrop-filter: blur(10px);
      font-size: 11px;
      letter-spacing: -0.02em;
    }

    @media (max-width: 900px) {
      .list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .search-row { grid-template-columns: 1fr 160px; }
      .clear-btn { grid-column: 1 / -1; }
    }

    @media (max-width: 620px) {
      .wrap { width: min(100% - 20px, 1180px); padding-top: 34px; }
      .control-panel { border-radius: 20px; padding: 13px; top: 8px; }
      .search-row { grid-template-columns: 1fr; }
      .clear-btn { grid-column: auto; }
      .meta-row { align-items: flex-start; flex-direction: column; }
      .list { grid-template-columns: 1fr; }
      .item { min-height: 74px; }
      .copy-mark { display: none; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <div class="badge">CNINE SIGNATURE LIST</div>
      <h1><span>씨나인 시그 검색</span></h1>
      <p class="subtitle">숫자 또는 시그 이름을 입력하면 실시간으로 검색됩니다.<br>검색 결과를 클릭하면 “숫자 이름”이 복사됩니다.</p>
    </section>

          <input id="searchInput" type="search" placeholder="예: 10067, 기사단, 신호탄" autocomplete="off" />
        </div>

        <select id="sortSelect" aria-label="정렬 방식">
          <option value="numberAsc">숫자 낮은순</option>
          <option value="numberDesc">숫자 높은순</option>
          <option value="nameAsc">이름 가나다순</option>
          <option value="nameDesc">이름 역순</option>
        </select>

        <button id="clearButton" class="clear-btn" type="button">검색 초기화</button>
      </div>

      <div class="meta-row">
        <div class="count">검색 결과 <strong id="resultCount">0</strong>개</div>
        <div class="hint">여러 단어 검색 가능 · 예: <b>혜루 신호탄</b></div>
      </div>
    </section>

    <section id="signatureList" class="list" aria-live="polite"></section>
    <footer>CNINE Signature Search · Single HTML Page</footer>
  </main>

  <div class="creator">제작자 : 아니요?</div>
  <div id="toast" class="toast" role="status">복사되었습니다.</div>

    ].map(([number, name], index) => ({ number, name, index }));

    const searchInput = document.getElementById('searchInput');
    const sortSelect = document.getElementById('sortSelect');
    const clearButton = document.getElementById('clearButton');
    const signatureList = document.getElementById('signatureList');
    const resultCount = document.getElementById('resultCount');
    const toast = document.getElementById('toast');

    const normalize = value => String(value).toLowerCase().replace(/\s+/g, ' ').trim();

    function getFilteredData() {
      const terms = normalize(searchInput.value).split(' ').filter(Boolean);

      const filtered = signatures.filter(item => {
        const searchable = normalize(`${item.number} ${item.name}`);
        return terms.every(term => searchable.includes(term));
      });

      const sorted = [...filtered];
      const mode = sortSelect.value;

      if (mode === 'numberAsc') {
        sorted.sort((a, b) => a.number - b.number || a.index - b.index);
      } else if (mode === 'numberDesc') {
        sorted.sort((a, b) => b.number - a.number || a.index - b.index);
      } else if (mode === 'nameAsc') {
        sorted.sort((a, b) => a.name.localeCompare(b.name, 'ko'));
      } else if (mode === 'nameDesc') {
        sorted.sort((a, b) => b.name.localeCompare(a.name, 'ko'));
      }

      return sorted;
    }

    function highlight(text, terms) {
      if (!terms.length) return escapeHtml(text);
      let result = escapeHtml(text);
      terms
        .sort((a, b) => b.length - a.length)
        .forEach(term => {
          const safe = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          result = result.replace(new RegExp(`(${safe})`, 'gi'), '<mark style="background:rgba(245,198,107,.26);color:#fff4cf;border-radius:4px;padding:0 2px;">$1</mark>');
        });
      return result;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function render() {
      const data = getFilteredData();
      const terms = normalize(searchInput.value).split(' ').filter(Boolean);
      resultCount.textContent = data.length.toLocaleString('ko-KR');

      if (!data.length) {
        signatureList.innerHTML = '<div class="empty">검색 결과가 없습니다.<br>숫자나 이름의 일부만 입력해보세요.</div>';
        return;
      }

      signatureList.innerHTML = data.map(item => `
        <button class="item" type="button" data-number="${item.number}" data-name="${escapeHtml(item.name)}" aria-label="${item.number} ${escapeHtml(item.name)} 복사">
          <span class="number">${highlight(item.number, terms)}</span>
          <span class="name">${highlight(item.name, terms)}</span>
          <span class="copy-mark">복사</span>
        </button>
      `).join('');
    }

    async function copySignature(number, name) {
      const text = `${number} ${name}`;
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const temp = document.createElement('textarea');
        temp.value = text;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        temp.remove();
      }
      toast.textContent = `${text} 복사 완료`;
      toast.classList.add('show');
      clearTimeout(copySignature.timer);
      copySignature.timer = setTimeout(() => toast.classList.remove('show'), 1400);
    }

    searchInput.addEventListener('input', render);
    sortSelect.addEventListener('change', render);
    clearButton.addEventListener('click', () => {
      searchInput.value = '';
      sortSelect.value = 'numberAsc';
      render();
      searchInput.focus();
    });

    signatureList.addEventListener('click', event => {
      const button = event.target.closest('.item');
      if (!button) return;
      copySignature(button.dataset.number, button.dataset.name);
    });

    const params = new URLSearchParams(location.search);
    const initialQuery = params.get('q');
    if (initialQuery) searchInput.value = initialQuery;

    searchInput.addEventListener('input', () => {
      const url = new URL(location.href);
      if (searchInput.value.trim()) url.searchParams.set('q', searchInput.value.trim());
      else url.searchParams.delete('q');
      history.replaceState(null, '', url);
    });

    render();
  </script>
