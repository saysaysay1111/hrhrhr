<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>명예의 전당</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #141414;
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #aa7c11;
            --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa7c11);
            --gold-gradient-soft: linear-gradient(135deg, rgba(191, 149, 63, 0.2), rgba(170, 124, 17, 0.2));
            --text-gold: #e5c158;
            --text-light: #e0e0e0;
            --text-muted: #888888;
            --border-gold: rgba(212, 175, 55, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            font-family: 'Noto Sans KR', sans-serif;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.15) 0%, transparent 70%),
                radial-gradient(circle at 50% 100%, rgba(10, 10, 10, 1) 0%, transparent 100%);
            background-attachment: fixed;
            padding-bottom: 60px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header Area */
        header {
            text-align: center;
            padding: 60px 20px 40px;
            position: relative;
        }

        .sub-header {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 6px;
            color: var(--gold-primary);
            text-transform: uppercase;
            margin-bottom: 12px;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        .main-title {
            font-family: 'Cinzel', 'Noto Sans KR', serif;
            font-size: 2.8rem;
            font-weight: 900;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            margin-bottom: 25px;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
            word-break: keep-all;
        }

        .divider {
            height: 2px;
            width: 200px;
            background: var(--gold-gradient);
            margin: 0 auto 30px;
            box-shadow: 0 0 10px var(--gold-primary);
            border-radius: 2px;
        }

        /* Stats & Search Section */
        .controls-wrapper {
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid var(--border-gold);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 40px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 15px rgba(212, 175, 55, 0.05);
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .stats-box {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            background: var(--gold-gradient-soft);
            border: 1px solid var(--gold-primary);
            padding: 12px 30px;
            border-radius: 50px;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }

        .stats-label {
            font-size: 1.1rem;
            font-weight: 500;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .stats-count {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--gold-light);
            text-shadow: 0 0 8px rgba(243, 229, 171, 0.8);
        }

        .search-box {
            position: relative;
            width: 100%;
            max-width: 600px;
        }

        .search-input {
            width: 100%;
            padding: 16px 24px;
            padding-right: 50px;
            background: rgba(10, 10, 10, 0.9);
            border: 1.5px solid var(--border-gold);
            border-radius: 30px;
            color: #ffffff;
            font-size: 1.05rem;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
        }

        .search-input:focus {
            border-color: var(--gold-primary);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4), inset 0 2px 5px rgba(0,0,0,0.8);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold-primary);
            font-size: 1.2rem;
            pointer-events: none;
        }

        .search-info {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-align: center;
        }

        /* Premium Trophy Hall / Top 3 Showcase */
        .podium-container {
            display: grid;
            grid-template-columns: 0.92fr 1.18fr 0.92fr;
            gap: 22px;
            margin: 10px 0 58px;
            align-items: end;
            position: relative;
            padding: 38px 14px 18px;
        }

        .podium-container::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 50% 28%, rgba(255,215,90,.18), transparent 34%),
                radial-gradient(circle at 18% 65%, rgba(206,216,226,.08), transparent 24%),
                radial-gradient(circle at 82% 65%, rgba(205,127,50,.08), transparent 24%);
            pointer-events: none;
            filter: blur(2px);
        }

        .podium-card {
            --rank-color: #d4af37;
            --rank-soft: rgba(212,175,55,.18);
            background: linear-gradient(180deg, rgba(25,25,25,.96), rgba(9,9,9,.98));
            border: 1px solid rgba(255,255,255,.10);
            border-radius: 24px;
            padding: 30px 22px 26px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 18px 45px rgba(0,0,0,.72), inset 0 1px 0 rgba(255,255,255,.06);
            transition: transform .35s ease, box-shadow .35s ease, border-color .35s ease;
            isolation: isolate;
        }

        .podium-card::before {
            content: '';
            position: absolute;
            left: 12%; right: 12%; top: -1px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--rank-color), transparent);
            box-shadow: 0 0 18px var(--rank-color);
        }

        .podium-card::after {
            content: '';
            position: absolute;
            width: 160px; height: 160px;
            border-radius: 50%;
            left: 50%; top: 60px;
            transform: translateX(-50%);
            background: var(--rank-soft);
            filter: blur(34px);
            opacity: .72;
            z-index: -1;
        }

        .podium-card:hover {
            transform: translateY(-8px);
            border-color: var(--rank-color);
            box-shadow: 0 24px 58px rgba(0,0,0,.76), 0 0 30px var(--rank-soft);
        }

        .podium-card.rank-1 {
            --rank-color: #ffd85a;
            --rank-soft: rgba(255,199,45,.28);
            order: 2;
            min-height: 430px;
            padding: 42px 25px 30px;
            border: 2px solid rgba(255,214,83,.72);
            background:
                linear-gradient(180deg, rgba(70,48,8,.98) 0%, rgba(22,16,5,.98) 36%, rgba(8,8,8,.99) 100%);
            box-shadow: 0 24px 65px rgba(0,0,0,.8), 0 0 45px rgba(255,190,40,.25), inset 0 0 38px rgba(255,215,80,.08);
            transform: translateY(-18px);
        }

        .podium-card.rank-1:hover { transform: translateY(-28px) scale(1.01); }
        .podium-card.rank-2 { --rank-color: #d8e0e8; --rank-soft: rgba(200,215,230,.16); order: 1; min-height: 360px; }
        .podium-card.rank-3 { --rank-color: #d78b45; --rank-soft: rgba(205,127,50,.17); order: 3; min-height: 340px; }

        .champion-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 7px 16px;
            border: 1px solid rgba(255,223,115,.58);
            border-radius: 999px;
            background: rgba(255,205,55,.10);
            color: #fff0b0;
            font: 700 .76rem 'Cinzel', serif;
            letter-spacing: 2.2px;
            text-transform: uppercase;
            box-shadow: inset 0 0 16px rgba(255,218,92,.08), 0 0 18px rgba(255,196,43,.12);
            margin-bottom: 18px;
        }

        .trophy-wrap {
            height: 136px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 6px;
        }

        .rank-1 .trophy-wrap { height: 165px; }
        .trophy-wrap::before {
            content: '';
            position: absolute;
            width: 116px; height: 116px;
            border-radius: 50%;
            border: 1px solid color-mix(in srgb, var(--rank-color) 36%, transparent);
            box-shadow: 0 0 28px var(--rank-soft), inset 0 0 24px var(--rank-soft);
            animation: trophyHalo 3.4s ease-in-out infinite;
        }
        .rank-1 .trophy-wrap::before { width: 145px; height: 145px; border-width: 2px; }

        .trophy-svg {
            width: 94px;
            height: 94px;
            position: relative;
            z-index: 2;
            color: var(--rank-color);
            filter: drop-shadow(0 0 12px var(--rank-soft));
        }
        .rank-1 .trophy-svg {
            width: 125px;
            height: 125px;
            filter: drop-shadow(0 0 18px rgba(255,207,68,.55));
            animation: trophyFloat 3s ease-in-out infinite;
        }

        .rank-1 .sparkle { position:absolute; color:#ffe9a0; text-shadow:0 0 12px #ffd85a; animation:spark 2.2s ease-in-out infinite; }
        .rank-1 .sparkle.s1 { left:18%; top:22%; font-size:16px; }
        .rank-1 .sparkle.s2 { right:17%; top:37%; font-size:12px; animation-delay:.7s; }
        .rank-1 .sparkle.s3 { right:25%; top:8%; font-size:10px; animation-delay:1.2s; }

        @keyframes trophyFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
        @keyframes trophyHalo { 0%,100%{opacity:.55; transform:scale(.94)} 50%{opacity:1; transform:scale(1.04)} }
        @keyframes spark { 0%,100%{opacity:.2; transform:scale(.7) rotate(0)} 50%{opacity:1; transform:scale(1.2) rotate(20deg)} }

        .podium-rank {
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--rank-color);
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        .rank-1 .podium-rank { font-size: 1.25rem; text-shadow: 0 0 14px rgba(255,213,75,.38); }

        .podium-name {
            font-size: 1.18rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
            white-space: pre-line;
            line-height: 1.42;
            word-break: break-word;
            max-height: 5.7em;
            overflow: auto;
            scrollbar-width: thin;
        }
        .rank-1 .podium-name { font-size: 1.45rem; color:#fff9de; }

        .podium-id { font-size: .88rem; color: #8d8d8d; margin-bottom: 17px; font-family: monospace; }
        .podium-amount {
            font-family: 'Cinzel', sans-serif;
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--rank-color);
            background: linear-gradient(90deg, transparent, var(--rank-soft), transparent);
            padding: 10px 20px;
            border-radius: 12px;
            display: inline-block;
            border-top: 1px solid color-mix(in srgb, var(--rank-color) 30%, transparent);
            border-bottom: 1px solid color-mix(in srgb, var(--rank-color) 18%, transparent);
        }
        .rank-1 .podium-amount { font-size: 1.45rem; padding: 12px 24px; }

        .podium-base {
            margin: 22px auto -30px;
            width: 76%;
            height: 22px;
            border-radius: 5px 5px 0 0;
            background: linear-gradient(180deg, color-mix(in srgb, var(--rank-color) 34%, #202020), #090909);
            border-top: 1px solid var(--rank-color);
            box-shadow: 0 -6px 18px var(--rank-soft);
            position: relative;
        }
        .rank-1 .podium-base { height:32px; width:82%; margin-top:25px; }
        .podium-base::after { content: attr(data-rank); position:absolute; inset:0; display:grid; place-items:center; font:900 .85rem 'Cinzel'; color:var(--rank-color); }

        @media (max-width: 850px) {
            .podium-container { grid-template-columns: 1fr; gap:18px; padding-top:12px; }
            .podium-card.rank-1 { order:1; transform:none; min-height:0; }
            .podium-card.rank-1:hover { transform:translateY(-8px); }
            .podium-card.rank-2 { order:2; min-height:0; }
            .podium-card.rank-3 { order:3; min-height:0; }
        }

        /* Table Design */
        .table-container {
            background: rgba(18, 18, 18, 0.85);
            border: 1px solid var(--border-gold);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        thead {
            background: linear-gradient(90deg, #1f1a0a, #2a220d, #1f1a0a);
            border-bottom: 2px solid var(--gold-primary);
        }

        th {
            padding: 18px 20px;
            font-family: 'Cinzel', 'Noto Sans KR', serif;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--gold-primary);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        th.text-center, td.text-center {
            text-align: center;
        }

        th.text-right, td.text-right {
            text-align: right;
        }

        tbody tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.2s ease;
        }

        tbody tr:hover {
            background: rgba(212, 175, 55, 0.08);
        }

        td {
            padding: 16px 20px;
            font-size: 0.98rem;
            vertical-align: middle;
        }

        .rank-cell {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            color: var(--gold-light);
            font-size: 1.1rem;
        }

        .name-cell {
            font-weight: 500;
            color: #ffffff;
            white-space: pre-line;
            line-height: 1.4;
        }

        .id-cell {
            color: var(--text-muted);
            font-family: monospace;
            font-size: 0.95rem;
        }

        .amount-cell {
            font-family: 'Cinzel', sans-serif;
            font-weight: 700;
            color: var(--gold-primary);
            font-size: 1.1rem;
        }

        .no-results {
            padding: 50px 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Infinite Scroll Loader */
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 76px;
            padding: 20px;
            background: linear-gradient(180deg, rgba(12,12,12,.35), rgba(12,12,12,.92));
            border-top: 1px solid rgba(212,175,55,.16);
        }
        .infinite-status {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
            font-size: .9rem;
            letter-spacing: .4px;
        }
        .loader-ring {
            width: 22px; height: 22px;
            border-radius: 50%;
            border: 2px solid rgba(212,175,55,.16);
            border-top-color: var(--gold-primary);
            animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .infinite-done { color: var(--gold-primary); font-family:'Cinzel','Noto Sans KR',serif; letter-spacing:1px; }

        /* Top Button */
        .top-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--gold-gradient);
            border: none;
            color: #000;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5), 0 0 15px rgba(212, 175, 55, 0.4);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .top-btn.visible {
            opacity: 1;
            visibility: visible;
        }

        .top-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.7);
        }
    </style>
</head>
<body>

    <header class="container">
        <div class="sub-header">24.05.07~26.08.22</div>
        <h1 class="main-title">838일을 함께해준 사람들</h1>
        <div class="divider"></div>
    </header>

    <main class="container">
        <!-- Controls & Stats -->
        <section class="controls-wrapper">
            <div class="stats-box">
                <span class="stats-label">🏆 총 후원자 수 :</span>
                <span class="stats-count" id="totalSponsorsCount">1,829</span>
                <span class="stats-label">명</span>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="닉네임 또는 아이디를 입력하여 검색하세요..." autocomplete="off">
                <span class="search-icon">🔍</span>
            </div>
            <div class="search-info" id="searchResultCount"></div>
        </section>

        <!-- Podium Hall (Top 3) -->
        <section class="podium-container" id="podiumSection">
            <!-- Rendered by JS -->
        </section>

        <!-- Data Table -->
        <section class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 12%;" class="text-center">순위</th>
                        <th style="width: 48%;">현재/최종 닉네임</th>
                        <th style="width: 20%;">아이디</th>
                        <th style="width: 20%;" class="text-right">총 후원 갯수</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Rendered by JS -->
                </tbody>
            </table>

            <div class="pagination-container" id="paginationControls">
                <div class="infinite-status" id="infiniteStatus">
                    <span class="loader-ring"></span>
                    <span>아래로 스크롤하면 다음 순위가 자동으로 표시됩니다.</span>
                </div>
                <div id="scrollSentinel" aria-hidden="true"></div>
            </div>
        </section>
    </main>

    <button class="top-btn" id="topBtn" onclick="scrollToTop()">▲</button>

            if (renderedCount >= filteredData.length) {
                infiniteStatus.innerHTML = `<span class="infinite-done">✦ ALL ${filteredData.length.toLocaleString('ko-KR')} HONORS DISPLAYED ✦</span>`;

        }

            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
